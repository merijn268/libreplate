      type: object
      properties:
        csrfToken:
          type: string
      required:
      - csrfToken
    DayMeal:
      type: object
      description: |-
        Serializer representing a meal slot for a specific day.

        If meal_id is null, the slot has not yet been persisted.
      properties:
        meal_id:
          type: integer
          nullable: true
        default_meal:
          $ref: '#/components/schemas/DefaultMeal'
        name:
          type: string
        date:
          type: string
          format: date
        note:
          type: string
        order:
          type: integer
        meal_foods:
          type: array
          items:
            $ref: '#/components/schemas/MealFood'
      required:
      - date
      - default_meal
      - meal_foods
      - meal_id
      - name
      - note
      - order
    DefaultMeal:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 50
        description:
          type: string
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - id
      - name
    EndEnum:
      enum:
      - never
      - on_day
      - after
      type: string
      description: |-
        * `never` - Never
        * `on_day` - On day
        * `after` - After
    Food:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        serving:
          type: number
          format: double
        unit:
          allOf:
          - $ref: '#/components/schemas/UnitBrief'
          readOnly: true
        unit_id:
          type: integer
          writeOnly: true
        barcode:
          type: string
          nullable: true
          maxLength: 50
        brand:
          type: string
          nullable: true
          maxLength: 255
        description:
          type: string
        is_favorite:
          type: boolean
        external_source:
          type: string
          nullable: true
        external_id:
          type: string
          nullable: true
        tags:
          type: array
          items:
