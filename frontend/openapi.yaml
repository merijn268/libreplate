      - serving_size
    MealPlan:
      type: object
      description: |-
        Full meal-plan representation.

        ``planned_meals`` contains both persisted PlannedMeal instances and
        virtual PlannedMeal instances generated from the user's DefaultMeals.

        Virtual planned meals:
        - are not saved to the database;
        - have ``id=None``;
        - are generated for missing default meals within the meal plan's duration;
        - cannot be addressed through the PlannedMeal CRUD endpoints until they
          have been persisted.
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        description:
          type: string
        start_day:
          type: integer
          maximum: 6
          minimum: 0
          description: Weekday number on which the meal plan starts (Monday=0).
        start_day_display:
          type: string
          readOnly: true
        duration:
          type: integer
          maximum: 32767
          minimum: 1
          description: Length of the meal plan.
        duration_period:
          allOf:
          - $ref: '#/components/schemas/MealPlanPeriodUnitEnum'
          description: |-
            Period used for the meal plan duration.

            * `day` - Day
            * `week` - Week
        user:
          type: integer
          readOnly: true
        tags:
          type: array
          items:
            type: integer
        is_favorite:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        last_used_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        planned_meals:
          type: array
          items:
            $ref: '#/components/schemas/PlannedMeal'
      required:
      - created_at
      - id
      - last_used_at
      - name
      - start_day_display
      - updated_at
      - user
    MealPlanMinimal:
