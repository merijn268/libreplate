      required:
      - day
      - id
      - is_virtual
      - name
      - weekday
    PlannedMealEntryRecurrence:
      type: object
      properties:
        interval_count:
          type: integer
          maximum: 32767
          minimum: 1
          description: Number of intervals between repetitions. For example, 2 with
            interval 'week' means every 2 weeks.
        interval:
          allOf:
          - $ref: '#/components/schemas/MealPlanPeriodUnitEnum'
          description: |-
            Unit used by interval_count.

            * `day` - Day
            * `week` - Week
        weekdays:
          description: List of weekday numbers on which the entry repeats when interval
            is 'week'. Values must be integers from 0 to 6, where Monday=0 and Sunday=6.
            For example, [0, 2, 4] means Monday, Wednesday, and Friday.
        end:
          allOf:
          - $ref: '#/components/schemas/EndEnum'
          description: |-
            Condition that determines when repetition ends.

            * `never` - Never
            * `on_day` - On day
            * `after` - After
        end_day:
          type: integer
          maximum: 2147483647
          minimum: 0
          nullable: true
          description: Day offset from the meal plan's start day on which repetition
            ends.
        end_after:
          type: integer
          maximum: 2147483647
          minimum: 1
          nullable: true
          description: Number of occurrences after which repetition ends.
